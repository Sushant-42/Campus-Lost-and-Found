openapi: 3.0.3

info:
  title: CampusEats Orders API
  description: API for creating, retrieving, listing, and cancelling orders.
  version: 1.0.0

servers:
  - url: http://localhost:5000

paths:
  /orders:
    get:
      summary: List orders
      operationId: listOrders
      responses:
        '200':
          description: Orders retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '500':
          $ref: '#/components/responses/ErrorResponse'

    post:
      summary: Create an order
      operationId: createOrder
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderInput'
      responses:
        '201':
          description: Order created
          headers:
            Location:
              description: URL of the created order
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'

  /orders/{order_id}:
    parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1

    get:
      summary: Get one order
      operationId: getOrder
      responses:
        '200':
          description: Order found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'

    delete:
      summary: Cancel an order
      operationId: cancelOrder
      responses:
        '200':
          description: Order cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'

components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Key used to safely retry an order-creation request.
      schema:
        type: string
        minLength: 1

  schemas:
    OrderInput:
      type: object
      required:
        - item_id
        - claimant_name
      properties:
        item_id:
          type: integer
          minimum: 1
        claimant_name:
          type: string
          minLength: 1

    Order:
      type: object
      required:
        - id
        - item_id
        - claimant_name
        - status
      properties:
        id:
          type: integer
        item_id:
          type: integer
        claimant_name:
          type: string
        status:
          type: string
          enum:
            - pending
            - approved
            - rejected

    Problem:
      type: object
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string

  responses:
    ErrorResponse:
      description: Request failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
